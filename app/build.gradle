plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.truvideo.sdk.image.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.truvideo.sdk.image.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }

    packaging {
        resources {
            it.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

apply {
    from("./lib-flavors.gradle")
}

dependencies {
    // Compose
    implementation platform('androidx.compose:compose-bom:2024.09.01')
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose'

    // Truvideo SDK
    implementation(project(":image"))
    implementation 'com.github.Truvideo:truvideo-sdk-android-core-local:75.1.1'
    implementation 'com.github.Truvideo:truvideo-sdk-android-components:0.1.20'
    implementation 'com.github.truvideo:truvideo-sdk-android-common:0.0.75'

    // Glide
    implementation 'com.github.bumptech.glide:compose:1.0.0-beta01'
}