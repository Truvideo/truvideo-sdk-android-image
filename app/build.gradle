plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.truvideo.sdk.image.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.truvideo.sdk.image.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            it.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    kotlin {
        jvmToolchain(17)
    }
}

apply {
    from("./lib-flavors.gradle")
}

dependencies {
    implementation(project(":image"))

    // Compose
    implementation platform('androidx.compose:compose-bom:2026.03.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose'

    // Truvideo SDK
    implementation 'com.github.truvideo:truvideo-sdk-android-core:79.1.3'
    implementation 'com.github.truvideo:truvideo-sdk-android-components:0.1.22'
    implementation 'com.github.truvideo:truvideo-sdk-android-common:0.0.79'

    // Glide
    implementation 'com.github.bumptech.glide:compose:1.0.0-beta08'
}